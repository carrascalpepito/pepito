<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel Administrador</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0b0010;
  color:white;
}

header {
  background:#111;
  padding:15px;
  text-align:center;
  font-size:20px;
}

.container {
  max-width:900px;
  margin:20px auto;
  padding:20px;
}

.card {
  background:#1a001f;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}

input, textarea, select {
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:6px;
  border:none;
}

button {
  padding:10px 15px;
  border:none;
  border-radius:6px;
  background:#ff0099;
  color:white;
  cursor:pointer;
}

button:hover {
  opacity:0.8;
}

.media-preview {
  width:100%;
  max-height:200px;
  object-fit:cover;
  border-radius:8px;
  margin-top:10px;
}
</style>
</head>
<body>

<header>PANEL ADMINISTRADOR</header>

<div class="container">

<div class="card">
<h3>Subir nuevo contenido</h3>

<input type="text" id="title" placeholder="Título">
<textarea id="description" placeholder="Descripción"></textarea>

<select id="type">
<option value="foto">Foto</option>
<option value="video">Video</option>
</select>

<input type="file" id="fileInput">
<button onclick="uploadContent()">Subir</button>

</div>

<div class="card">
<h3>Contenido existente</h3>
<div id="contentList"></div>
</div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js"></script>

<script>
/* PEGA AQUÍ TU firebaseConfig */
</script>

</body>
</html>
