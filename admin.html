<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel Administrador</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0b0010;
  color:white;
}

header {
  background:#111;
  padding:20px;
  text-align:center;
  font-size:22px;
  letter-spacing:1px;
}

.container {
  max-width:900px;
  margin:20px auto;
  padding:20px;
}

.card {
  background:#1a001f;
  padding:20px;
  border-radius:10px;
  margin-bottom:20px;
  box-shadow:0 0 15px rgba(255,0,150,0.2);
}

input, textarea, select {
  width:100%;
  padding:10px;
  margin:8px 0;
  border-radius:6px;
  border:none;
  background:#2a002f;
  color:white;
}

button {
  padding:10px 15px;
  border:none;
  border-radius:6px;
  background:#ff0099;
  color:white;
  cursor:pointer;
  font-weight:bold;
}

button:hover {
  opacity:0.85;
}

.delete-btn{
  background:red;
  margin-top:8px;
}

.logout-btn{
  background:#444;
  margin-bottom:15px;
}

hr{
  border:1px solid rgba(255,255,255,0.1);
  margin:15px 0;
}

.hidden{
  display:none;
}
</style>
</head>
<body>

<header>PANEL ADMINISTRADOR</header>

<div class="container hidden" id="adminPanel">

<div class="card">
<button class="logout-btn" onclick="logout()">Cerrar Sesión</button>
</div>

<div class="card">
<h3>Subir Nuevo Contenido</h3>

<input type="text" id="title" placeholder="Título">
<textarea id="description" placeholder="Descripción"></textarea>

<select id="type">
<option value="foto">Foto</option>
<option value="video">Video</option>
</select>

<input type="file" id="fileInput">

<button onclick="uploadContent()">Subir Contenido</button>
</div>

<div class="card">
<h3>Contenido Existente</h3>
<div id="contentList"></div>
</div>

</div>

<!-- FIREBASE COMPAT -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>

<script>

/* ✅ TU CONFIG REAL */
const firebaseConfig = {
  apiKey: "AIzaSyB0Hcu8ZF4z2fJQMCLj6zI9l6RwNWW9g54",
  authDomain: "pepito-admin.firebaseapp.com",
  projectId: "pepito-admin",
  storageBucket: "pepito-admin.appspot.com",
  messagingSenderId: "107847700755",
  appId: "1:107847700755:web:c5ef8552b6a00e44664ae6"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();
const storage = firebase.storage();
const auth = firebase.auth();

/* ================= LOGIN ================= */

auth.onAuthStateChanged(user => {

  if(user){
    document.getElementById("adminPanel").classList.remove("hidden");
    loadContent();
  }else{
    login();
  }

});

function login(){
  const email = prompt("Correo admin:");
  const password = prompt("Contraseña:");

  auth.signInWithEmailAndPassword(email, password)
    .catch(error => {
      alert("Error: " + error.message);
      login();
    });
}

function logout(){
  auth.signOut().then(()=>{
    location.reload();
  });
}

/* ================= SUBIR ================= */

async function uploadContent(){

  const file = document.getElementById("fileInput").files[0];
  const title = document.getElementById("title").value;
  const description = document.getElementById("description").value;
  const type = document.getElementById("type").value;

  if(!file) return alert("Selecciona un archivo");

  const storageRef = storage.ref("contenido/"+Date.now()+"_"+file.name);
  await storageRef.put(file);

  const url = await storageRef.getDownloadURL();

  await db.collection("contenido").add({
    title,
    description,
    type,
    url,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });

  alert("Contenido subido correctamente ✅");

  document.getElementById("title").value = "";
  document.getElementById("description").value = "";
  document.getElementById("fileInput").value = "";
}

/* ================= LISTAR ================= */

function loadContent(){

  db.collection("contenido")
  .orderBy("createdAt","desc")
  .onSnapshot(snapshot=>{

    const list = document.getElementById("contentList");
    list.innerHTML = "";

    snapshot.forEach(doc=>{

      const data = doc.data();

      list.innerHTML += `
        <div>
          <strong>${data.title}</strong><br>
          <small>${data.type}</small><br>
          <button class="delete-btn" onclick="deleteContent('${doc.id}')">Eliminar</button>
          <hr>
        </div>
      `;
    });
  });

}

/* ================= ELIMINAR ================= */

async function deleteContent(id){
  if(confirm("¿Eliminar este contenido?")){
    await db.collection("contenido").doc(id).delete();
  }
}

</script>

</body>
</html>
